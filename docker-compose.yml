services:
  db:
    image: pgvector/pgvector:pg16
    container_name: postgres_vector
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=vectordb
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mypassword
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d vectordb"]
      interval: 5s
      timeout: 5s
      retries: 5
